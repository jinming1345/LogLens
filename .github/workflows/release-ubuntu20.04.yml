name: Release Ubuntu 20.04

on:
  push:
    tags:
      - "ubuntu20.04-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Ubuntu 20.04 package
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            wget \
            file \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            git \
            xz-utils

      - uses: actions/checkout@v4

      - name: Install Node.js 20 and pnpm
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          npm install -g pnpm@9

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Upload Ubuntu 20.04 release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "LogLens ${{ github.ref_name }} (Ubuntu 20.04)"
          body: |
            Ubuntu 20.04/Focal dedicated build.

            This build uses the Tauri v1/WebKitGTK 4.0 stack and does not depend on libwebkit2gtk-4.1.
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/loglens
