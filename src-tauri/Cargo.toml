[package]
name = "loglens"
version = "1.0.1"
description = "LogLens - A beautiful log viewer for developers"
authors = ["LogLens"]
edition = "2021"

[lib]
name = "loglens_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "1.5.6", features = [] }

[dependencies]
tauri = { version = "1.8.3", features = ["api-all", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
regex = "1"
notify = "8"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
csv = "1.3"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
walkdir = "2"
